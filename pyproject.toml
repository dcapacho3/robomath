[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "robomath"
version = "0.1.0"
authors = [
  { name="David Capacho Parra", email="dcapacho3@gmail.com" },
]
description = "The maths of robot pose and motion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]
keywords = ["robotics", "rotations", "quaternions", "lie-groups", "se3", "so3", "kinematics", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/dcapacho3/robomath"
Source = "https://github.com/dcapacho3/robomath"
Issues = "https://github.com/dcapacho3/robomath/issues"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4.6.2", "pytest-cov>=7.1.0", "modern_robotics>=1.1.0", "scipy>=1.18.1", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
